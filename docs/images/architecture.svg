<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420">
  <rect width="960" height="420" fill="#0d1117"/>
  <text x="32" y="40" fill="#e6edf3" font-family="Segoe UI, sans-serif" font-size="22" font-weight="700">Classic Grid · Architecture</text>
  <text x="32" y="64" fill="#8b949e" font-family="Segoe UI, sans-serif" font-size="13">loop ’ grid plan ’ venue adapters ’ exchanges · dashboard reads snapshot</text>

  <rect x="40" y="100" width="160" height="70" rx="12" fill="#161b22" stroke="#58a6ff"/>
  <text x="120" y="130" text-anchor="middle" fill="#58a6ff" font-family="Segoe UI, sans-serif" font-size="14" font-weight="700">loop.ts</text>
  <text x="120" y="150" text-anchor="middle" fill="#8b949e" font-family="Segoe UI, sans-serif" font-size="12">tick / soft-resume</text>

  <rect x="260" y="100" width="160" height="70" rx="12" fill="#161b22" stroke="#3fb950"/>
  <text x="340" y="130" text-anchor="middle" fill="#3fb950" font-family="Segoe UI, sans-serif" font-size="14" font-weight="700">grid.ts</text>
  <text x="340" y="150" text-anchor="middle" fill="#8b949e" font-family="Segoe UI, sans-serif" font-size="12">seed / replace</text>

  <rect x="480" y="100" width="200" height="70" rx="12" fill="#161b22" stroke="#d29922"/>
  <text x="580" y="130" text-anchor="middle" fill="#d29922" font-family="Segoe UI, sans-serif" font-size="14" font-weight="700">venues/*</text>
  <text x="580" y="150" text-anchor="middle" fill="#8b949e" font-family="Segoe UI, sans-serif" font-size="12">5 adapters</text>

  <rect x="740" y="100" width="180" height="70" rx="12" fill="#161b22" stroke="#39c5cf"/>
  <text x="830" y="130" text-anchor="middle" fill="#39c5cf" font-family="Segoe UI, sans-serif" font-size="14" font-weight="700">Exchanges</text>
  <text x="830" y="150" text-anchor="middle" fill="#8b949e" font-family="Segoe UI, sans-serif" font-size="12">API / chain</text>

  <path d="M200 135 H260" stroke="#30363d" stroke-width="2" marker-end="url(#a)"/>
  <path d="M420 135 H480" stroke="#30363d" stroke-width="2" marker-end="url(#a)"/>
  <path d="M680 135 H740" stroke="#30363d" stroke-width="2" marker-end="url(#a)"/>

  <rect x="40" y="220" width="280" height="70" rx="12" fill="#161b22" stroke="#a371f7"/>
  <text x="180" y="250" text-anchor="middle" fill="#a371f7" font-family="Segoe UI, sans-serif" font-size="14" font-weight="700">officialStats.ts</text>
  <text x="180" y="270" text-anchor="middle" fill="#8b949e" font-family="Segoe UI, sans-serif" font-size="12">volume / fee / realized (throttled)</text>

  <rect x="360" y="220" width="280" height="70" rx="12" fill="#161b22" stroke="#58a6ff"/>
  <text x="500" y="250" text-anchor="middle" fill="#58a6ff" font-family="Segoe UI, sans-serif" font-size="14" font-weight="700">dashboard.ts + public/</text>
  <text x="500" y="270" text-anchor="middle" fill="#8b949e" font-family="Segoe UI, sans-serif" font-size="12">/api/snapshot · ladder view</text>

  <rect x="680" y="220" width="240" height="70" rx="12" fill="#161b22" stroke="#3fb950"/>
  <text x="800" y="250" text-anchor="middle" fill="#3fb950" font-family="Segoe UI, sans-serif" font-size="14" font-weight="700">telegram.ts</text>
  <text x="800" y="270" text-anchor="middle" fill="#8b949e" font-family="Segoe UI, sans-serif" font-size="12">open/close · daily overview</text>

  <text x="32" y="340" fill="#e6edf3" font-family="Segoe UI, sans-serif" font-size="14" font-weight="700">Fill ’ Replace</text>
  <text x="32" y="365" fill="#8b949e" font-family="Segoe UI, sans-serif" font-size="13">buy fills at level i ’ place sell at i+1 · sell fills ’ place buy at i-1 · skipBand near mid</text>
  <text x="32" y="395" fill="#8b949e" font-family="Segoe UI, sans-serif" font-size="12">SOFT_RESUME restores anchors from local data/status.json (never commit that file)</text>

  <defs>
    <marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#8b949e"/>
    </marker>
  </defs>
</svg>
